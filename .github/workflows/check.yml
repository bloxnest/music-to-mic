# On every push and pull request: build the app and run the self-tests that don't need sound devices.
# (The routing, cable and window tests need real audio devices and a desktop, so they run on a real PC:
# tests\run-tests.bat.)
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Get the source
        uses: actions/checkout@v7

      - name: Build the app
        shell: cmd
        run: build.bat

      - name: Build and run the self-tests (mixer, drift, settings)
        shell: cmd
        run: tests\run-tests.bat mixer drift settings
